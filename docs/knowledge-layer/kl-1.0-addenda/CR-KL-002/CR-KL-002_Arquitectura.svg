<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>KL 1.0 · Arquitectura con CR-KL-002 (base beeside_kl)</title>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#194C5C"/></marker>
    <marker id="x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#B42318"/></marker>
  </defs>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#2E0879">KL 1.0 · Topología con CR-KL-002</text>
  <text x="40" y="68" fill="#4A6B77">Backend compartido · base propia beeside_kl en la misma instancia Cloud SQL · salida a red solo desde kl-worker</text>

  <!-- Backend -->
  <rect x="40" y="100" width="520" height="300" rx="12" fill="#F1F1FA" stroke="#5B3EA8"/>
  <text x="60" y="128" font-weight="700" fill="#2E0879">Backend compartido (Cloud Run · misma imagen)</text>
  <rect x="60" y="146" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#8A7FC4"/>
  <text x="74" y="170" font-weight="600" fill="#194C5C">Precision</text>
  <text x="74" y="192" fill="#194C5C">turn-engine · puerto knowledge</text>
  <text x="74" y="212" fill="#194C5C">openEdition · /verificar/&lt;id&gt;</text>
  <text x="74" y="236" fill="#B42318">sin herramientas web</text>
  <rect x="310" y="146" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#8A7FC4"/>
  <text x="324" y="170" font-weight="600" fill="#194C5C">Control Center · KL Admin</text>
  <text x="324" y="192" fill="#194C5C">sesión OIDC (beeside)</text>
  <text x="324" y="212" fill="#194C5C">kl.attest → kl.require</text>
  <text x="324" y="236" fill="#194C5C">conciliación · correlación</text>
  <rect x="60" y="272" width="480" height="108" rx="8" fill="#FFFFFF" stroke="#8A7FC4"/>
  <text x="74" y="296" font-weight="600" fill="#194C5C">Módulo backend/src/kl (en proceso)</text>
  <text x="74" y="318" fill="#194C5C">kl/retrieval · kl/demand · kl/products/delivery · kl/admin-api</text>
  <text x="74" y="340" fill="#194C5C" font-size="13">credenciales: kl_reader_precision · kl_app (nunca kl_agent / kl_knowledge)</text>
  <text x="74" y="362" fill="#B42318">kl/retrieval sin cliente HTTP (lint)</text>

  <!-- kl-worker -->
  <rect x="640" y="100" width="520" height="190" rx="12" fill="#EAF4F1" stroke="#1F7A5C"/>
  <text x="660" y="128" font-weight="700" fill="#14513D">kl-worker (Cloud Run Job · cuenta propia)</text>
  <text x="660" y="152" fill="#14513D">agente recolector · agente de conocimiento · planificador</text>
  <text x="660" y="174" fill="#14513D">compilación de RAM · render PDF (Chromium, sin red)</text>
  <text x="660" y="196" fill="#14513D">cola kl.job (SKIP LOCKED)</text>
  <text x="660" y="218" fill="#14513D">credenciales: kl_agent · kl_knowledge · sin acceso a beeside</text>
  <text x="660" y="248" font-weight="600" fill="#14513D">Egreso Direct VPC → Cloud NAT → firewall FQDN</text>
  <text x="660" y="270" fill="#14513D">permitido: dominios aprobados + proveedor del modelo · resto denegado</text>

  <rect x="900" y="320" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#1F7A5C" stroke-dasharray="5 4"/>
  <text x="916" y="348" font-weight="600" fill="#14513D">Fuentes del Source Registry</text>
  <text x="916" y="370" fill="#14513D">solo dominios aprobados</text>
  <line x1="1030" y1="290" x2="1030" y2="318" stroke="#194C5C" stroke-width="2" marker-end="url(#a)"/>

  <!-- Cloud SQL -->
  <rect x="40" y="450" width="1120" height="230" rx="14" fill="#FAFAFC" stroke="#194C5C"/>
  <text x="60" y="478" font-weight="700" fill="#194C5C">Instancia Cloud SQL PostgreSQL 16 (existente · respaldos y PITR de instancia)</text>
  <rect x="60" y="496" width="480" height="164" rx="10" fill="#FFFFFF" stroke="#4A6B77"/>
  <text x="76" y="522" font-weight="600" fill="#194C5C">beeside (sin cambios)</text>
  <text x="76" y="546" fill="#194C5C">Discovery · Precision · Control Center</text>
  <text x="76" y="568" fill="#194C5C">admin_user · admin_session · admin_audit_event</text>
  <text x="76" y="590" fill="#194C5C">rate_limit_counter · migraciones 0000–0016 (+ ramas)</text>
  <text x="76" y="620" fill="#4A6B77">usuario app · KL solo lee la sesión desde el backend</text>
  <rect x="660" y="496" width="480" height="164" rx="10" fill="#FFFFFF" stroke="#5B3EA8" stroke-width="2"/>
  <text x="676" y="522" font-weight="600" fill="#2E0879">beeside_kl (CR-KL-002) · esquema kl</text>
  <text x="676" y="546" fill="#2E0879">dueño kl_owner · CONNECT revocado a PUBLIC</text>
  <text x="676" y="568" fill="#2E0879">kl.principal · kl.request_attestation · kl.role_grant</text>
  <text x="676" y="590" fill="#2E0879">kl.audit_event · kl.job · contenido, RAM, productos</text>
  <text x="676" y="612" fill="#2E0879">journal propio KL-NNNN · exportación diaria propia</text>
  <text x="676" y="640" fill="#2E0879">acceso solo por vistas y funciones</text>

  <!-- arrows -->
  <line x1="300" y1="400" x2="300" y2="494" stroke="#194C5C" stroke-width="2" marker-end="url(#a)"/>
  <text x="310" y="440" fill="#194C5C">app (sesión)</text>
  <line x1="480" y1="400" x2="700" y2="494" stroke="#194C5C" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="430" fill="#194C5C">kl_app · kl_reader_precision</text>
  <line x1="900" y1="290" x2="900" y2="494" stroke="#194C5C" stroke-width="2" marker-end="url(#a)"/>
  <text x="910" y="440" fill="#194C5C">kl_agent · kl_knowledge</text>
  <line x1="640" y1="190" x2="562" y2="190" stroke="#B42318" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#x)"/>
  <text x="566" y="178" fill="#B42318" font-size="12">sin secretos</text>
  <text x="566" y="210" fill="#B42318" font-size="12">cruzados</text>

  <text x="40" y="720" fill="#4A6B77">G1 escalada de privilegios · G2 base, roles y restauración · G3 egreso probado · G4 titulares y arranque KL_ADMIN — antes de cualquier entorno compartido.</text>
  <text x="40" y="742" fill="#4A6B77">El egreso del backend compartido no lo cambia KL: queda registrado para Plataforma (CR-KL-002 §5).</text>
</svg>
