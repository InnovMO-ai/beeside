<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Verificar edición · beeside</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F8F8FC}
a{color:#2E0879}a:hover{color:#161D35}
</style>
</helmet>
<div style="min-height: 100%; background: #F8F8FC; color: #161D35; font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 8px clamp(16px, 3.4vw, 40px); min-height: 60px">
<img src="/_blob/8f3b3336a973ff01b1033357f12e1646" alt="beeside" style="height: 24px; width: auto">
<div role="group" aria-label="Idioma / Language" style="display: flex; align-items: center; gap: 2px">
<button type="button" lang="en" aria-pressed="{{isEn}}" onClick="{{toEn}}" style="min-width: 44px; min-height: 44px; border: 0; background: transparent; font: inherit; font-weight: {{enWeight}}; color: #161D35; cursor: pointer">EN</button><span aria-hidden="true" style="color: #5F6480">/</span><button type="button" lang="es" aria-pressed="{{isEs}}" onClick="{{toEs}}" style="min-width: 44px; min-height: 44px; border: 0; background: transparent; font: inherit; font-weight: {{esWeight}}; color: #161D35; cursor: pointer">ES</button>
</div>
</div>
<div style="max-width: 520px; width: 100%; margin: clamp(32px, 10vh, 96px) auto; padding: 0 clamp(16px, 3.4vw, 40px); box-sizing: border-box; display: grid; gap: 16px">
<div style="padding: 10px 14px; border: 1px dashed #8A8FA5; border-radius: 10px; font-size: 13px; color: #3B4262">Prototipo · cambia el estado:
<select value="{{state}}" onChange="{{pick}}" aria-label="Estado de prototipo" style="font: inherit; margin-left: 6px; padding: 4px 6px; border: 1px solid #8A8FA5; border-radius: 6px; background: #fff"><option value="current">Vigente</option><option value="superseded">Sustituida</option><option value="revoked">Revocada</option><option value="unknown">Identificador no reconocido</option></select></div>
<span style="font: 600 11px/1.3 'Public Sans', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #5F6480">{{t.eyebrow}}</span>
<h1 style="margin: 0; font: 600 26px/1.25 'Public Sans', sans-serif; color: #161D35">{{t.title}}</h1>
<div role="status" style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 10px; border: 1px solid {{tone.line}}; background: {{tone.bg}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{tone.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 2px; flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
<div style="flex: 1; min-width: 0"><strong style="display: block; font-size: 15px; color: {{tone.ink}}">{{t.status}}</strong><p style="margin: 4px 0 0; color: #3B4262; font-size: 14px; line-height: 1.5">{{t.body}}</p></div>
</div>
<sc-if value="{{known}}" hint-placeholder-val="{{true}}">
<dl style="margin: 0; display: grid; gap: 8px; padding: 16px; border: 1px solid #E4E4EE; border-radius: 10px; background: #FFFFFF">
<div style="display: flex; justify-content: space-between; gap: 12px"><dt style="color: #5F6480">{{t.edition}}</dt><dd style="margin: 0; font-weight: 600">[2026.1]</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><dt style="color: #5F6480">{{t.published}}</dt><dd style="margin: 0">[fecha]</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><dt style="color: #5F6480">{{t.languages}}</dt><dd style="margin: 0">{{t.langValue}}</dd></div>
</dl>
</sc-if>
<p style="margin: 0; color: #3B4262; line-height: 1.5">{{t.access}}</p>
<p style="margin: 0; color: #5F6480; font-size: 13px; line-height: 1.5">{{t.privacy}}</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { s: 'current', lang: 'es' }; }
renderVals() {
const { s, lang } = this.state;
const T = {
es: {
eyebrow: 'Doing Business beeside México', title: 'Verificación de edición',
edition: 'Edición', published: 'Publicada', languages: 'Idiomas', langValue: 'Español e inglés',
access: 'Si tienes acceso a beeside, descarga siempre la edición vigente desde tu espacio de trabajo.',
privacy: 'Esta página solo indica el estado de una edición. No muestra su contenido ni registra quién consulta.',
current: ['Vigente', 'Esta es la edición vigente de la guía.'],
superseded: ['Sustituida', 'Existe una edición más reciente: [2026.2]. La información de esta copia corresponde a su fecha de corte.'],
revoked: ['Revocada', 'Esta edición fue retirada el [fecha] y no debe usarse como referencia.'],
unknown: ['No reconocemos este identificador', 'Revisa el enlace impreso al final de tu copia.']
},
en: {
eyebrow: 'Doing Business beeside México', title: 'Edition check',
edition: 'Edition', published: 'Published', languages: 'Languages', langValue: 'Spanish and English',
access: 'If you have access to beeside, always download the current edition from your workspace.',
privacy: 'This page only shows the status of an edition. It does not show its content or record who checks it.',
current: ['Current', 'This is the current edition of the guide.'],
superseded: ['Superseded', 'A newer edition exists: [2026.2]. The information in this copy reflects its cut-off date.'],
revoked: ['Withdrawn', 'This edition was withdrawn on [date] and should not be used as a reference.'],
unknown: ['We do not recognise this identifier', 'Check the link printed at the end of your copy.']
}
}[lang];
const tones = { current: { bg: '#E9F4F0', line: '#C1E0D5', ink: '#0A6B4F' }, superseded: { bg: '#FDF3E1', line: '#EBCB8B', ink: '#7A4D00' }, revoked: { bg: '#FBE9EE', line: '#A3153E', ink: '#A3153E' }, unknown: { bg: '#FFFFFF', line: '#E4E4EE', ink: '#3B4262' } };
return {
state: s, known: s !== 'unknown', tone: tones[s],
t: { ...T, status: T[s][0], body: T[s][1] },
isEn: lang === 'en', isEs: lang === 'es', enWeight: lang === 'en' ? 700 : 400, esWeight: lang === 'es' ? 700 : 400,
toEn: () => this.setState({ lang: 'en' }), toEs: () => this.setState({ lang: 'es' }),
pick: (e) => this.setState({ s: e.target.value })
};
}
}
</script>
</body>
</html>
