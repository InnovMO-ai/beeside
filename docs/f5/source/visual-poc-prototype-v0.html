<title>Precision Visual POC</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap');
/* Layout concept: Precision Center como espacio editorial de una sola columna conversacional + un documento reutilizable (PSM / CRP / Preview).
   Una capa de revisión del PO (barra oscura) queda fuera de la experiencia del cliente. Tema único claro por decisión de marca. */
:root{
  --purple-900:#2E0879; --purple-700:#7654C8; --purple-500:#7357C1; --lav-300:#AB97E4; --lav-100:#C6C1ED;
  --purple-100:#EDE9F8; --purple-050:#F6F4FC; --teal:#01B1A9; --teal-100:#E1F5F3; --rose:#CB2A55;
  --bg:#F1F1FA; --ink:#17181B; --ink-muted:#5B5C63; --ink-faint:#8A8B99; --semaphore:#FFDE59;
  --line:#E3E1F0; --card:#FFFFFF; --warm:#F2F1EE; --po:#1B1530; --po-2:#2A2245; --po-ink:#E9E4FB;
  --f-display:'Poppins','Avenir','Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --f-body:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--purple-700);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);color:var(--purple-900);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}

/* ---------- Capa de revisión del PO ---------- */
#po{background:var(--po);color:var(--po-ink);font-size:12px;position:sticky;top:0;z-index:60}
.po-in{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.po-tag{display:inline-flex;gap:6px;align-items:center;background:var(--po-2);border-radius:100px;padding:3px 10px;letter-spacing:.04em;font-weight:600;text-transform:uppercase;font-size:10.5px}
.po-tag b{color:var(--semaphore);font-weight:700}
.po-sp{flex:1 1 20px}
.po select,.po button{background:var(--po-2);color:var(--po-ink);border:1px solid #4a3f78;border-radius:100px;padding:4px 12px;font-size:12px}
.po button[aria-pressed="true"]{background:var(--lav-300);color:var(--po);border-color:var(--lav-300);font-weight:700}
.po label{display:inline-flex;gap:6px;align-items:center}
.po-lbl{opacity:.75}
.po-note{margin:18px 0 0;border:1.5px dashed var(--purple-700);background:var(--purple-050);color:var(--purple-900);border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.5}
.po-note b{letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;display:block;margin-bottom:2px;color:var(--purple-700)}
body.no-notes .po-note{display:none}

/* ---------- Marco (escritorio / móvil) ---------- */
#frame{max-width:1280px;margin:0 auto}
#stage{container-type:inline-size;container-name:stg;background:var(--bg);position:relative;min-height:calc(100vh - 44px)}
#frame.mobile{padding:18px 0 40px;display:flex;justify-content:center}
#frame.mobile #stage{width:390px;height:790px;min-height:0;overflow:hidden;border:10px solid #17181B;border-radius:44px;box-shadow:0 20px 50px rgba(46,8,121,.25)}
#scroller{min-height:inherit}
#frame.mobile #scroller{height:100%;overflow-y:auto;overflow-x:hidden}
.overlay{position:fixed;inset:0;z-index:50}
.overlay.in-stage{position:absolute}
.wrap{max-width:1160px;margin:0 auto;padding-inline:clamp(16px,4cqw,40px)}

/* ---------- Cabecera ---------- */
#top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
#frame:not(.mobile) #top{top:var(--po-h,44px)}
.top-in{display:flex;align-items:center;gap:20px;padding-block:12px}
.logo{height:30px;display:block}
.brand-btn{background:none;border:0;padding:0;display:flex;align-items:center;gap:12px}
.brand-sub{font-family:var(--f-display);font-weight:600;color:var(--purple-900);font-size:14px;padding-left:12px;border-left:1px solid var(--line)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:100px;font-weight:600;font-size:14px;color:var(--ink-muted)}
.nav button[aria-current="page"]{color:var(--purple-900);background:var(--purple-100)}
.nav button:hover{color:var(--purple-900)}
.top-sp{flex:1}
.proj{font-size:13px;color:var(--ink-muted);white-space:nowrap}
.proj b{color:var(--ink);font-weight:600}
.help-btn{background:#fff;border:1.5px solid var(--purple-700);color:var(--purple-900);border-radius:100px;padding:7px 16px;font-weight:600;font-size:13.5px;display:inline-flex;gap:8px;align-items:center}
.help-btn:hover{background:var(--purple-050)}
.help-btn i{width:18px;height:18px;border-radius:50%;background:var(--purple-900);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center;font-weight:700}
@container stg (max-width:900px){
  .proj{display:none}
  .nav{order:5;margin:0;width:100%;overflow-x:auto}
  .top-in{flex-wrap:wrap;gap:8px 12px;padding-block:10px}
  .brand-sub{display:none}
}

/* ---------- Tipografía y botones ---------- */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--purple-700)}
.display{font-size:clamp(28px,5.2cqw,46px);line-height:1.12;font-weight:700}
.lead{color:var(--ink-muted);max-width:62ch;font-size:16px}
.btn{background:var(--purple-900);color:#fff;border:0;border-radius:100px;padding:12px 24px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:10px;transition:background .15s}
.btn:hover{background:#3d12a0}
.btn::after{content:"›";font-size:20px;line-height:1;margin-top:-2px}
.btn.noarrow::after{content:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-o{background:#fff;color:var(--purple-900);border:1.5px solid var(--purple-900)}
.btn-o:hover{background:var(--purple-050)}
.btn-o::after{content:none}
.btn-t{background:none;border:0;color:var(--purple-700);font-weight:600;padding:6px 4px;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.btn-sm{padding:8px 16px;font-size:13.5px}

/* ---------- Estados (gramática única) ---------- */
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:100px;padding:3px 11px;font-size:12px;font-weight:600;background:var(--purple-100);color:var(--purple-900);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip.s-confirmed{background:var(--teal-100);color:#0a6f6a}.chip.s-confirmed i{background:var(--teal)}
.chip.s-estimated{background:var(--purple-100);color:var(--purple-900)}.chip.s-estimated i{background:transparent;border:2px solid var(--purple-700)}
.chip.s-pending{background:var(--warm);color:#4a4430}.chip.s-pending i{background:var(--semaphore);box-shadow:0 0 0 1px rgba(0,0,0,.18) inset}
.chip.s-na{background:transparent;color:var(--ink-muted);border:1px dashed var(--line)}.chip.s-na i{display:none}
.chip.s-notasked{background:transparent;color:var(--ink-muted);border:1.5px dashed var(--ink-faint)}.chip.s-notasked i{display:none}
.chip.ver{background:var(--purple-900);color:#fff}.chip.ver i{display:none}
.chip.plain i{display:none}
.chip.sent{background:var(--teal-100);color:#0a6f6a}
.tag{font-size:11.5px;font-weight:600;color:var(--purple-900);border:1px solid var(--lav-100);background:#fff;border-radius:6px;padding:2px 8px;white-space:nowrap}

/* ---------- Documento reutilizable (PSM · CRP · Preview) ---------- */
.doc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4.4cqw,44px);min-width:0}
.doc-h h1{font-size:clamp(24px,3.6cqw,34px);line-height:1.18;margin:6px 0 12px;font-weight:700}
.doc.d-compact{padding:clamp(16px,3cqw,24px)}
.doc.d-compact .doc-h h1{font-size:19px;margin:4px 0 8px}
.doc .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.doc-h .lead{margin-top:14px}
.sec{border-top:1px solid var(--line);margin-top:26px;padding-top:22px}
.d-compact .sec{margin-top:14px;padding-top:12px}
.sec h3{font-size:16px;font-weight:600;margin-bottom:10px}
.sec .intro{color:var(--ink-muted);margin-bottom:10px;max-width:64ch}
.row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:6px 20px;padding:10px 0;border-bottom:1px solid #F0EEF8;align-items:start}
.row:last-child{border-bottom:0}
.rl{color:var(--ink-muted);font-size:14px}
.rl small{display:block;color:var(--ink-faint);font-size:12px;margin-top:2px}
.rv{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:flex-start;min-width:0}
.val{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.row-int{background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(118,84,200,.05) 8px 16px);margin-inline:-8px;padding-inline:8px;border-radius:8px}
@container stg (max-width:640px){.row{grid-template-columns:1fr}}
.svc{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 14px;padding:14px 0;border-bottom:1px solid #F0EEF8;align-items:start}
.svc:last-child{border-bottom:0}
.hex{width:14px;height:16px;background:var(--purple-900);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);margin-top:5px}
.svc.new .hex{background:var(--teal)}
.svc h4{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--purple-900)}
.svc p{color:var(--ink-muted);font-size:14px;margin-top:2px;max-width:60ch}
.svc-a{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.d-compact .svc{padding:9px 0}.d-compact .svc p{display:none}.d-compact .svc h4{font-size:14px}
@container stg (max-width:640px){.svc{grid-template-columns:22px 1fr}.svc-a{grid-column:2;align-items:flex-start;flex-direction:row;flex-wrap:wrap}}
.vpath{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.vpath .arrow{color:var(--purple-700);font-size:18px}
.delta{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.delta li{display:flex;gap:10px;align-items:flex-start}
.delta .plus{color:#0a6f6a;font-weight:700;width:18px}
.delta .same{color:var(--ink-faint);width:18px;font-weight:700}
.pend-list{list-style:none;margin:0;padding:0}
.pend-list li{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid #F0EEF8}
.pend-list li:last-child{border-bottom:0}
.pend-list .pl{flex:1 1 220px;color:var(--ink)}
.empty{color:var(--ink-muted);font-style:normal;padding:6px 0}
.banner{background:var(--purple-050);border:1px solid var(--lav-100);border-radius:12px;padding:12px 16px;color:var(--purple-900);margin-bottom:18px}
.banner.ok{background:var(--teal-100);border-color:#b4e6e2;color:#0a5d58}
.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%{background:var(--lav-100)}100%{background:transparent}}

/* ---------- Home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,5cqw,64px);padding-block:clamp(28px,6cqw,64px);align-items:start}
@container stg (max-width:900px){.hero{grid-template-columns:1fr}}
.hero .display{margin:10px 0 16px}
.hero .cta-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:26px}
.cap{margin-top:22px;max-width:420px}
.cap-top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-muted)}
.bar{height:6px;border-radius:6px;background:var(--lav-100);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--purple-900);border-radius:6px;transition:width .5s}
.cap small{display:block;color:var(--ink-faint);font-size:12px;margin-top:6px}
.section{padding-block:clamp(22px,4cqw,40px);border-top:1px solid var(--line)}
.section h2{font-size:clamp(20px,2.8cqw,26px);margin-bottom:6px}
.cat-list{margin-top:14px}
.cat{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.cat:last-child{border-bottom:0}
.cat h3{font-size:17px;font-weight:600}
.cat p{color:var(--ink-muted);font-size:14px}
.cat-a{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@container stg (max-width:640px){.cat{grid-template-columns:22px 1fr}.cat-a{grid-column:2;justify-content:flex-start}}
.cat .hex{margin-top:0}
.cat.new .hex{background:var(--teal)}
.oh-box{background:var(--purple-900);color:#fff;border-radius:16px;padding:clamp(20px,4cqw,34px);display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.oh-box h2{color:#fff;font-size:20px}
.oh-box p{color:#DCD4F6;max-width:56ch;margin-top:6px}

/* ---------- Premium ---------- */
.premium{background:var(--purple-900);color:#fff;border-radius:20px;margin-top:clamp(16px,4cqw,40px);padding:clamp(28px,7cqw,84px);display:grid;gap:18px;justify-items:start}
.premium h1{color:#fff;font-size:clamp(32px,6.4cqw,60px);line-height:1.08}
.premium p{color:#DCD4F6;max-width:52ch;font-size:17px}
.premium .eyebrow{color:var(--lav-300)}
.premium .btn{background:#fff;color:var(--purple-900)}
.premium .btn:hover{background:var(--purple-100)}
.premium .btn-t{color:#DCD4F6}

/* ---------- Conversación ---------- */
.chat{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:clamp(24px,5cqw,64px);padding-block:clamp(18px,3cqw,36px) 40px;align-items:start}
@container stg (max-width:900px){.chat{grid-template-columns:1fr}.comp{display:none}.composer{bottom:58px}}
.chat-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.chat-h h1{font-size:clamp(22px,3.2cqw,30px)}
.chat-h .cap{margin:0;min-width:200px;flex:0 1 240px}
.back{background:none;border:0;color:var(--purple-700);font-weight:600;padding:0;margin-bottom:8px;font-size:14px}
#thread{display:flex;flex-direction:column;gap:20px;padding-bottom:20px}
.msg-p{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;max-width:68ch}
.avatar{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.avatar img{width:24px;height:auto;display:block}
.msg-p .who{font-size:12px;font-weight:700;color:var(--purple-700);letter-spacing:.04em;margin-bottom:2px}
.msg-p p+p{margin-top:8px}
.msg-p .q{font-size:17.5px;color:var(--ink);font-weight:500;line-height:1.5}
.why{color:var(--ink-muted);font-size:13px;margin-top:8px;padding-left:12px;border-left:2px solid var(--lav-100)}
.msg-u{align-self:flex-end;background:var(--purple-100);color:var(--purple-900);padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:min(80%,52ch);font-weight:500}
.kcard{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.kcard .row{padding:8px 0}
.think{display:flex;gap:12px;align-items:flex-start;color:var(--ink-muted);padding-left:46px;font-size:14px}
.think .tt{display:block}.think .t2{display:block;color:var(--ink-faint);font-size:13px;margin-top:2px}
.dots{display:inline-flex;gap:4px;margin-top:7px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--purple-700);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.composer{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 78%,rgba(241,241,250,0));padding-top:18px;padding-bottom:14px}
.cmp{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px;box-shadow:0 6px 24px rgba(46,8,121,.08)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:#fff;border:1.5px solid var(--lav-100);color:var(--purple-900);border-radius:100px;padding:9px 18px;font-weight:600;font-size:14.5px;display:inline-flex;gap:8px;align-items:center}
.opt:hover{border-color:var(--purple-700);background:var(--purple-050)}
.opt[aria-pressed="true"]{background:var(--purple-900);color:#fff;border-color:var(--purple-900)}
.opt .prop{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;font-weight:700}
.txt{display:flex;gap:8px}
.txt input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:100px;padding:9px 16px;font:inherit;background:#fff;color:var(--ink)}
.txt input:focus{border-color:var(--purple-700);outline:0;box-shadow:0 0 0 3px rgba(118,84,200,.2)}
.sec-links{display:flex;gap:16px;flex-wrap:wrap}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.btn-eq{background:#fff;color:var(--purple-900);border:1.5px solid var(--purple-900);border-radius:100px;padding:11px 22px;font-weight:600;font-size:14.5px}
.btn-eq:hover{background:var(--purple-050)}
.cmp[aria-busy="true"]{opacity:.5;pointer-events:none}

/* ---------- Acompañante ---------- */
.comp{position:sticky;top:calc(var(--po-h,44px) + 84px);display:grid;gap:16px}
.know{background:transparent;border-top:1px solid var(--line);padding-top:14px}
.know summary{cursor:pointer;font-family:var(--f-display);font-weight:600;color:var(--purple-900);font-size:15px;list-style:none;display:flex;justify-content:space-between}
.know summary::after{content:"+";color:var(--purple-700)}
.know[open] summary::after{content:"–"}
.know h4{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--purple-700);margin:14px 0 2px}
.know .row{grid-template-columns:1fr;padding:7px 0;gap:3px}
.know .rl{font-size:12.5px}
.know .val{font-size:13.5px}
.edit{background:none;border:0;color:var(--purple-700);font-size:12px;font-weight:600;padding:0;text-decoration:underline}
.edit-f{display:flex;gap:6px;margin-top:4px}
.edit-f input{flex:1;min-width:0;border:1.5px solid var(--lav-100);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.dock{display:none}
@container stg (max-width:900px){
  .dock{display:flex;position:sticky;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:10px 16px;justify-content:space-between;align-items:center;gap:12px}
}
.dock b{font-family:var(--f-display);color:var(--purple-900);font-size:14px}

/* ---------- PSM, categoría, preview ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(20px,4cqw,48px);padding-block:clamp(18px,3cqw,34px) 56px;align-items:start}
@container stg (max-width:900px){.two{grid-template-columns:1fr}}
.aside{position:sticky;top:calc(var(--po-h,44px) + 84px);display:grid;gap:14px}
@container stg (max-width:900px){.aside{position:static}}
.apanel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
.apanel h3{font-size:15px}
.apanel .count{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-muted);font-size:13px}
.apanel .count b{color:var(--ink);font-family:var(--f-display);font-size:20px;display:block;line-height:1.1}
.vtabs{display:flex;gap:6px;flex-wrap:wrap}
.vtabs button{border:1.5px solid var(--lav-100);background:#fff;color:var(--purple-900);border-radius:100px;padding:5px 14px;font-weight:600;font-size:13px}
.vtabs button[aria-pressed="true"]{background:var(--purple-900);color:#fff;border-color:var(--purple-900)}
.pv{display:grid;gap:26px}
.pv-b{display:grid;gap:10px}
.pv-b>.eyebrow{display:flex;justify-content:space-between;gap:12px;align-items:center}
.pv-b>.eyebrow button{text-transform:none;letter-spacing:0}
.ident{background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3.4cqw,30px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px 30px}
@container stg (max-width:640px){.ident{grid-template-columns:1fr}}
.ident h2{font-size:22px}
.ident dl{margin:0;display:grid;gap:8px}
.ident dt{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.ident dd{margin:0;font-weight:600}
.ctxgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 36px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3cqw,26px)}
@container stg (max-width:760px){.ctxgrid{grid-template-columns:1fr}}
.ctxgrid h4{font-family:var(--f-display);font-size:14px;color:var(--purple-900);margin:0 0 4px}
.nosend{color:var(--ink-muted);font-size:13.5px;border-left:2px solid var(--lav-100);padding-left:12px;max-width:70ch}
.actbar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,rgba(241,241,250,0));padding:18px 0 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sent-h{display:grid;gap:14px;padding-block:clamp(28px,6cqw,64px) 8px;justify-items:start}
.tl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:0;max-width:560px}
.tl li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:20px;position:relative}
.tl li::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--lav-100)}
.tl li:last-child::before{display:none}
.tl .dot{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.tl .dot.p{background:var(--semaphore);color:transparent;box-shadow:0 0 0 1px rgba(0,0,0,.18) inset}
.tl b{display:block}.tl span{color:var(--ink-muted);font-size:14px}

/* ---------- Ayuda ---------- */
#help{display:none;background:rgba(23,24,27,.35)}
#help.open{display:block}
.hp{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:#fff;padding:22px;overflow-y:auto;box-shadow:-12px 0 40px rgba(46,8,121,.18);display:flex;flex-direction:column;gap:16px}
.hp header{display:flex;justify-content:space-between;align-items:center}
.hp h2{font-size:20px}
.hp .ctx{background:var(--purple-050);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--purple-900)}
.hp details{border-bottom:1px solid var(--line);padding:10px 0}
.hp summary{cursor:pointer;font-weight:600;color:var(--ink)}
.hp details p{color:var(--ink-muted);margin-top:8px;font-size:14px}
.hp textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical}
.hp textarea:focus{border-color:var(--purple-700);outline:0;box-shadow:0 0 0 3px rgba(118,84,200,.2)}
.x{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1}
#sheet{display:none;background:rgba(23,24,27,.35)}
#sheet.open{display:block}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:82%;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px 28px;overflow-y:auto;display:grid;gap:16px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
'use strict';
/* ====== Utilidades ====== */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const DATE='8 oct 2026';
const LOGO=window.__LOGO__, BEE=window.__BEE__;
const LAT={
  rapid:{label:'Rápida (para revisar)',ms:1500,stream:260},
  med:{label:'F4 mediana · 7 s',ms:7000,stream:70},
  p95:{label:'F4 p95 · 11 s',ms:11000,stream:70},
  slow:{label:'Excepcional · +20 s',ms:22000,stream:70}
};
const STATE={confirmed:'Confirmado',estimated:'Estimado',pending:'Pendiente',na:'No aplica',notasked:'No preguntado · vista interna'};

/* ====== Catálogo (sintético) ====== */
const CATS={
  legal:{name:'Constitución y administración legal',why:'Tu entidad en Alemania está en trámite y necesita registro y administración societaria.'},
  tax:{name:'Impuestos, contabilidad y auditoría',why:'Con una entidad propia necesitarás contabilidad e impuestos en el destino.'},
  people:{name:'Personas, nómina y contratación',why:'Planeas contratar y pagar a un equipo en Alemania.'},
  trade:{name:'Comercio exterior y aduanas',why:'Vas a importar tu producto desde México.'},
  logistics:{name:'Logística y almacenaje',why:'Quieres almacenar y distribuir tu producto en el destino.'},
  ip:{name:'Propiedad intelectual y marcas',why:'Quieres proteger tu marca en la Unión Europea.',added:true},
  label:{name:'Etiquetado y cumplimiento alimentario',why:'Necesitas revisar el etiquetado de tus productos para el mercado alemán.',added:true}
};
const ROLES=['Tú','Dirección general','Finanzas','Legal','Procurement','Otra persona del equipo','Otro rol'];

/* ====== Estado ====== */
let S;
function baseFacts(){return{
  dest:{label:'Destino',value:'Alemania',state:'confirmed',layer:'project'},
  product:{label:'Producto',value:'Snacks funcionales de origen vegetal',state:'confirmed',layer:'project'},
  horizon:{label:'Horizonte',value:'12 meses',state:'confirmed',layer:'project'},
  co_trade:{label:'Empresa',value:'Aurora Nutrición',state:'confirmed',layer:'company',share:true},
  headcount:{label:'Personas en el proyecto (estimado)',value:'',state:'notasked',layer:'project'},
  bank_payments:{label:'Pagos bancarios al mes',value:'',state:'notasked',layer:'service',scope:'tax'},
  imports:{label:'Importaciones al mes',value:'',state:'notasked',layer:'service',scope:'tax'}
}}
function fresh(prev){
  return{tok:prev?prev.tok+1:1,view:'premium',arg:null,mobile:prev?prev.mobile:false,
    po:prev?prev.po:{lat:'rapid',internal:false,notes:true},
    facts:baseFacts(),
    pu:{done:false},
    draftCats:[],
    versions:[],           // snapshots del PSM
    viewVer:null,          // versión que se está viendo
    cat:{},                // estado por categoría
    crps:{},               // CRP inmutables
    sent:{any:false,list:[],deliveredPsm:null},
    msgs:{},cur:{},pushed:{},ret:{},chatScope:null,
    prevExpand:{psm:false,crp:false},
    helpOpen:false,sheetOpen:false,confirmed:false,flashCat:null};
}
function setFact(k,p){S.facts[k]=Object.assign({},S.facts[k]||{},p)}
function putAns(k,label,ans,o={}){
  const base={label,layer:o.layer||'project',scope:o.scope,exec:!!o.exec,step:o.step,share:o.share};
  if(ans.kind==='unknown')return setFact(k,Object.assign(base,{value:'Aún sin definir',state:'pending'}));
  if(ans.kind==='withheld')return setFact(k,Object.assign(base,{value:'Sin compartir por ahora',state:'pending'}));
  setFact(k,Object.assign(base,{value:ans.label,state:o.est?'estimated':'confirmed'}));
}
const catStatus=k=>S.cat[k]||{state:'notstarted',pct:0};
function catLabel(k){const c=catStatus(k);return c.state==='completed'?'Completada':c.state==='inprogress'?'En curso · '+c.pct+' %':'Sin iniciar'}
const psmCurrent=()=>S.versions.length?S.versions[S.versions.length-1]:null;
const factsOf=layer=>Object.entries(S.facts).filter(([k,f])=>f.layer===layer);
const chipHtml=st=>st?`<span class="chip s-${st}"><i></i>${STATE[st]}</span>`:'';

/* ====== Documento reutilizable ====== */
function rowHtml(r){
  if(!r||!r.label)return'';
  if(r.state==='notasked'&&!S.po.internal)return'';
  return`<div class="row${r.state==='notasked'?' row-int':''}"><div class="rl">${esc(r.label)}${r.note?`<small>${esc(r.note)}</small>`:''}</div><div class="rv">${r.value?`<span class="val">${esc(r.value)}</span>`:''}${chipHtml(r.state)}${r.exec?'<span class="tag">Dependencia para la ejecución</span>':''}</div></div>`;
}
function secHtml(s){
  let body='';
  if(s.type==='text')body=`<p class="intro" style="margin:0">${esc(s.text)}</p>`;
  else if(s.type==='rows'){const h=s.rows.map(rowHtml).join('');body=h||'<p class="empty">Aún no hay datos en esta sección.</p>'}
  else if(s.type==='services'){body=s.items.length?s.items.map(i=>`<div class="svc${i.added?' new':''}"><span class="hex" aria-hidden="true"></span><div><h4>${esc(i.name)}</h4><p>${esc(i.why)}</p></div><div class="svc-a">${i.status?`<span class="chip plain">${esc(i.status)}</span>`:''}${i.open?`<button class="btn-t" data-open-cat="${i.key}">${i.openLabel}</button>`:''}</div></div>`).join(''):'<p class="empty">Precision irá proponiendo servicios a medida que me cuentes tu proyecto.</p>'}
  else if(s.type==='pending'){body=s.items.length?`<ul class="pend-list">${s.items.map(i=>`<li><span class="pl">${esc(i.label)}${i.value?' · '+esc(i.value):''}</span>${chipHtml(i.state||'pending')}${i.exec?'<span class="tag">Dependencia para la ejecución</span>':''}</li>`).join('')}</ul>`:'<p class="empty">No hay puntos pendientes.</p>'}
  else if(s.type==='delta'){body=`<div class="vpath"><span class="chip ver">v${esc(s.from)}</span><span class="arrow">→</span><span class="chip ver">v${esc(s.to)}</span><span class="chip plain">Se conserva v${esc(s.from)}</span></div><ul class="delta">${s.added.map(a=>`<li><span class="plus">+</span><span><b>Se añadió:</b> ${esc(a)}</span></li>`).join('')}<li><span class="same">=</span><span>${esc(s.same)} sin cambios</span></li></ul>`}
  return`<section class="sec"><h3>${esc(s.title)}</h3>${s.intro?`<p class="intro">${esc(s.intro)}</p>`:''}${body}</section>`;
}
function renderDoc(d,o={}){
  const dens=o.density||'full';
  const secs=d.sections.filter(s=>dens==='full'||!s.fullOnly).map(secHtml).join('');
  return`<article class="doc d-${dens}" aria-label="${esc(d.title)}"><header class="doc-h"><div class="eyebrow">${esc(d.eyebrow)}</div><h1>${esc(d.title)}</h1><div class="meta">${d.meta.map(m=>`<span class="chip ${m.cls||'plain'}">${esc(m.t)}</span>`).join('')}</div>${dens==='full'&&d.lead?`<p class="lead">${esc(d.lead)}</p>`:''}</header>${secs}</article>`;
}

/* ====== Constructores de documento ====== */
function svcItems(keys,opts){
  const conf=opts.confirmed&&!opts.outgoing;
  return keys.map(k=>({key:k,name:CATS[k].name,why:CATS[k].why,added:CATS[k].added,status:conf?catLabel(k):null,open:conf,openLabel:catStatus(k).state==='completed'?'Ver paquete':catStatus(k).state==='inprogress'?'Continuar categoría':'Abrir categoría'}));
}
function snapFacts(snap){return snap?snap.facts:S.facts}
function psmDoc(snap,po){po=po||{};
  const draft=!snap;
  const f=draft?S.facts:snap.facts;
  const cats=draft?S.draftCats:snap.cats;
  const confirmed=!draft;
  const superseded=snap&&S.versions.length&&snap!==psmCurrent();
  const rows=['dest','product','horizon','operating_entity'].filter(k=>f[k]).map(k=>f[k]);
  const comp=['co_legal','co_hq','co_web','co_employees','co_taxid','co_revenue'].filter(k=>f[k]).map(k=>f[k]);
  const pend=Object.values(f).filter(x=>(x.layer==='company'||x.layer==='project')&&x.state==='pending');
  const meta=[{t:'v'+(snap?snap.version:'1.0'),cls:'ver'},{t:draft?'En construcción':superseded?'Versión anterior':'Confirmado el '+DATE}];
  meta.push({t:'Alemania · snacks funcionales'});
  const secs=[];
  if(snap&&snap.delta)secs.push({type:'delta',title:'Qué cambió respecto a v'+snap.delta.from,from:snap.delta.from,to:snap.version,added:snap.delta.added,same:snap.delta.same});
  secs.push({type:'rows',title:'Tu proyecto',rows:rows,fullOnly:true});
  secs.push({type:'services',title:'Servicios identificados',intro:confirmed?null:'Esta lista cambia mientras conversamos.',items:svcItems(cats,{confirmed,outgoing:po.outgoing})});
  secs.push({type:'rows',title:'Contexto de tu empresa',rows:comp.length?comp:[f.co_trade],fullOnly:true});
  secs.push({type:'pending',title:'Pendientes por confirmar',intro:'No bloquean nada. Quedan visibles en cada paquete.',items:pend,fullOnly:true});
  return{eyebrow:'My Precision Service Map',title:draft?'Mapa de servicios para tu expansión a Alemania':'Mapa de servicios para tu expansión a Alemania',meta,
    lead:'Este mapa resume qué servicios necesita tu proyecto, qué ya está definido y qué sigue pendiente. Describe lo que me has contado; no es una evaluación.',sections:secs};
}
function pendingOf(scope){return Object.entries(S.facts).filter(([k,f])=>f.scope===scope&&f.state==='pending').map(([k,f])=>Object.assign({key:k},f))}
function crpDoc(k){
  const F=S.facts,c=CATS[k];
  const R=(key,note)=>Object.assign({},F[key],note?{note}:{});
  const pend=pendingOf(k);
  const secs=[];
  if(k==='tax'){
    secs.push({type:'text',title:'Objetivo de la categoría',text:'Tener contabilidad mensual y declaraciones de impuestos para la entidad alemana, con un calendario de cierres acordado.'});
    secs.push({type:'rows',title:'Servicios requeridos',rows:[R('tax_scope'),R('tax_audit')]});
    secs.push({type:'rows',title:'Volumen mensual estimado',intro:'Cifras aproximadas. No se piden montos por ahora.',rows:[R('inv_in'),R('inv_out'),R('bank_payments'),R('imports')],fullOnly:true});
    secs.push({type:'rows',title:'Entidad y contexto fiscal',rows:[R('operating_entity','Reutilizado de tu mapa'),R('tax_id_de'),R('related'),R('related_req')],fullOnly:true});
    secs.push({type:'rows',title:'Dirigido a',rows:[R('recipient_role','Función, no nombre de una persona')]});
  }else{
    secs.push({type:'text',title:'Objetivo de la categoría',text:'Contratar y pagar al equipo del proyecto en Alemania, con el tipo de nómina y las prestaciones definidos.'});
    secs.push({type:'rows',title:'Equipo y nómina',rows:[R('headcount'),R('payroll_freq'),R('benefits')]});
    secs.push({type:'rows',title:'Entidad',rows:[R('operating_entity','Reutilizado de tu mapa')]});
    secs.push({type:'rows',title:'Dirigido a',rows:[R('recipient_role','Función, no nombre de una persona')]});
  }
  secs.push({type:'pending',title:'Información pendiente / Elementos por confirmar',intro:'Cada punto indica si puede esperar o si se necesita para ejecutar.',items:pend});
  const sent=S.sent.list.find(s=>s.cat===k);
  const meta=[{t:'CRP',cls:'ver'},{t:'Versión 1.0'},{t:pend.length?'Completado con pendientes':'Completado'}];
  if(sent)meta.push({t:'Enviado a Operation Hub · '+DATE,cls:'sent'});
  return{eyebrow:'Category Requirement Pack',title:c.name,meta,lead:'Este paquete resume lo que definiste para esta categoría. Lo pendiente queda marcado y no se presenta como definido.',sections:secs};
}
function contextRows(){
  const F=S.facts;
  const comp=['co_legal','co_hq','co_web','co_employees'].filter(k=>F[k]&&F[k].state!=='pending').map(k=>F[k]);if(!comp.length&&F.co_trade)comp.push(F.co_trade);
  const proj=['dest','product','horizon','operating_entity'].filter(k=>F[k]&&F[k].state!=='pending').map(k=>F[k]);
  const withheld=Object.values(F).some(f=>(f.layer==='company'||f.layer==='project')&&f.state==='pending');
  return{comp,proj,withheld};
}
function knowHtml(){
  const groups=[['Empresa','company'],['Proyecto','project'],['Propuesta','proposal']];
  return groups.map(([t,l])=>{
    const items=factsOf(l).filter(([k,f])=>f.state!=='notasked'||S.po.internal);
    return`<h4>${t}</h4>`+(items.length?items.map(([k,f])=>`<div class="row${f.state==='notasked'?' row-int':''}" data-fk="${k}"><div class="rl">${esc(f.label)}</div><div class="rv"><span class="val">${esc(f.value||'—')}</span>${chipHtml(f.state)}${f.exec?'<span class="tag">Dependencia para la ejecución</span>':''}${f.state!=='notasked'?`<button class="edit" data-edit="${k}">Corregir</button>`:''}</div></div>`).join(''):'<p class="empty" style="font-size:13px">Aún no hay datos.</p>');
  }).join('');
}
function psmCompact(){
  const snap=S.viewVer&&S.versions.find(v=>v.version===S.viewVer);
  const cur=psmCurrent();
  const doc=psmDoc(cur||null);

}

/* ====== Motor de conversación (guion determinista, datos sintéticos) ====== */
function stream(el,text,o={}){return new Promise(res=>{
  if(REDUCED||o.fast){el.textContent=text;return res()}
  const cps=LAT[S.po.lat].stream,t0=performance.now(),tok=S.tok;
  (function step(now){
    if(tok!==S.tok||!el.isConnected)return res();
    const n=Math.min(text.length,Math.floor((now-t0)/1000*cps));
    el.textContent=text.slice(0,n);
    if(n<text.length)requestAnimationFrame(step);else res();
  })(t0);
})}
function scrollEnd(){const t=$('#thread');if(!t)return;const e=t.lastElementChild;if(e)e.scrollIntoView({block:'center',behavior:REDUCED?'auto':'smooth'})}
async function think(phases,o={}){
  const tok=S.tok,L=LAT[S.po.lat],th=$('#thread');
  if(!th){await sleep(L.ms);return}
  const box=document.createElement('div');box.className='think';box.setAttribute('role','status');
  box.innerHTML='<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span><span class="tt"></span><span class="t2"></span></span>';
  th.append(box);scrollEnd();
  const tt=$('.tt',box),t2=$('.t2',box),t0=performance.now(),n=phases.length;
  let last=-1,skip=false,retry=false;
  while(true){
    if(tok!==S.tok){box.remove();return}
    const el=performance.now()-t0;
    if(el>=L.ms||skip)break;
    const ph=Math.min(n-1,Math.floor(el/(L.ms/n)));
    if(ph!==last){tt.textContent=phases[ph]+'…';last=ph}
    if(S.po.lat==='slow'&&el>19000){
      if(!retry){retry=true;t2.innerHTML='Está tardando más de lo normal. Tu respuesta está guardada. <button class="btn-t" type="button">Reintentar</button>';$('button',t2).onclick=()=>{skip=true}}
    }else if(L.ms>=7000&&el>9000){t2.textContent='Sigue en proceso. Tu respuesta ya está guardada.'}
    await sleep(120);
  }
  box.remove();
}

  await think(ph);
  if(tok!==S.tok||S.chatScope!==scope||S.view!=='chat')return;
  if(st.psm)refreshComp({flash:true});else refreshComp();
  await present(scope,nxt,{noThink:true});
}
async function finishCat(scope){
  const tok=S.tok;userSay(scope,'Continuar con información pendiente');
  const cmp=$('#cmp');if(cmp)cmp.setAttribute('aria-busy','true');
  await think(['Reuniendo lo que me contaste','Armando tu paquete']);
  if(tok!==S.tok)return;
  completeCat(scope);go('category',scope);
}
async function completeNow(scope){
  const tok=S.tok,L=SCRIPTS[scope];userSay(scope,'Completar ahora');
  const finalIdx=S.cur[scope];
  const first=pendingOf(scope).find(f=>f.step!=null);
  const cmp=$('#cmp');if(cmp)cmp.setAttribute('aria-busy','true');
  if(!first){
    await think(['Revisando lo pendiente']);if(tok!==S.tok)return;
    const msg={who:'p',paras:['Lo que queda pendiente se completa después, en Operation Hub. No lo necesitas para cerrar este paquete.'],why:'',card:'',step:finalIdx};
    S.msgs[scope].push(msg);$('#thread').insertAdjacentHTML('beforeend',msgDom(msg));
    const c=$('#composer');c.innerHTML=`<div class="cmp"><div class="btn-row"><button class="btn" id="only-cont">Continuar con información pendiente</button></div></div>`;$('#only-cont').onclick=()=>finishCat(scope);scrollEnd();return;
  }
  S.ret[scope]=finalIdx;S.cur[scope]=first.step;
  await think(['Retomando ese punto']);
  if(tok!==S.tok)return;
  await present(scope,first.step,{noThink:true,reask:true});
}
async function startCat(k){
  if(!SCRIPTS[k]){S.stub=k;render();return}
  go('chat',k);
}

/* ====== Eventos ====== */
function closeOverlays(){S.helpOpen=false;S.sheetOpen=false;$('#help').classList.remove('open');$('#sheet').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlays()});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]');
  if(e.target.id==='help'||e.target.id==='sheet')return closeOverlays();
  if(!t)return;
  if(t.dataset.go){
    if(t.dataset.arg==='add'){S.msgs.add=[];S.cur.add=null;S.pushed.add=null}
    S.anchor=t.dataset.anchor||null;
    return go(t.dataset.go,t.dataset.arg);
  }
  if(t.id==='helpbtn'){S.helpOpen=true;$('#help').classList.add('open');renderHelp();const x=$('#help-x');if(x)x.focus();return}
  if(t.id==='help-x')return closeOverlays();
  if(t.id==='hc-send'){const v=$('#hc-t').value.trim();if(v){$('#hc-ok').textContent='Mensaje recibido. beeside te responderá por correo.';$('#hc-t').value=''}return}
  if(t.id==='open-sheet'){S.sheetOpen=true;$('#sheet').classList.add('open');renderSheet();return}
  if(t.id==='sheet-x')return closeOverlays();
  if(t.dataset.ver){S.viewVer=t.dataset.ver;return render()}
  if(t.dataset.exp){S.prevExpand[t.dataset.exp]=!S.prevExpand[t.dataset.exp];return render()}
  if(t.dataset.openCat)return go('category',t.dataset.openCat);
  if(t.id==='confirm-psm')return confirmPsm();
  if(t.id==='start-cat')return startCat(t.dataset.k);
  if(t.id==='send-oh')return sendOH(t.dataset.k);
  if(t.dataset.edit){
    const k=t.dataset.edit,row=t.closest('.row'),rv=$('.rv',row),f=S.facts[k];
    rv.innerHTML=`<form class="edit-f" data-k="${k}"><input type="text" value="${esc(f.value&&f.state!=='pending'?f.value:'')}" aria-label="Corregir ${esc(f.label)}"><button class="btn btn-sm noarrow" type="submit">Guardar</button></form>`;
    const inp=$('input',rv);inp.focus();
    $('form',rv).onsubmit=ev=>{ev.preventDefault();const v=inp.value.trim();if(v){setFact(k,{value:v,state:'confirmed',exec:false});}refreshComp({flash:true});if(S.view==='psm'||S.view==='home')render()};
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='po-lat'){S.po.lat=e.target.value}
  if(e.target.id==='po-jump'&&e.target.value){const v=e.target.value;e.target.value='';jump(v)}
});
$('#po').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='po-int'){S.po.internal=!S.po.internal;S.view==='chat'?(renderPO(),refreshComp()):render()}
  if(b.id==='po-notes'){S.po.notes=!S.po.notes;render()}
  if(b.id==='po-mob'){S.mobile=!S.mobile;go(S.view,S.arg)}
  if(b.id==='po-reset'){S=fresh(S);S.mobile=S.mobile;go('premium')}
});

/* ====== Arranque ====== */
S=fresh();
document.addEventListener('DOMContentLoaded',()=>{});
render();
window.__POC__={get S(){return S},go,jump,render};
})();
