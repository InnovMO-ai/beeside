name: CI

# Runs on every pull request and on pushes to main. This is the gate a code
# change must pass before it can flow to any environment (Build Plan v1.1
# FINAL, Phase 1 acceptance criteria: "a code change flows dev -> staging ->
# production with no manual file copying"). No deploy job runs from here —
# deployment is triggered separately per environment (see deploy-*.yml).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: ["shared/canonical-fields", "shared/fa-public-engine", "backend", "frontend"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: matrix.workspace != 'shared/canonical-fields' && matrix.workspace != 'shared/fa-public-engine'
        run: npm run lint --workspace=${{ matrix.workspace }}

      - name: Build
        run: npm run build --workspace=${{ matrix.workspace }}

      # Precision's document extraction (backend/src/knowledge-layer/extract.ts) calls the system tools pdftotext (poppler-utils) and
      # unzip; the hosted runner image does not guarantee them, and without them the backend suites fail with «spawnSync pdftotext ENOENT».
      - name: System tools for document extraction (backend only)
        if: matrix.workspace == 'backend'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils unzip
          command -v pdftotext unzip   # the step fails if either tool did not get installed
          pdftotext -v 2>&1 | head -1

      - name: Test
        run: npm run test --workspace=${{ matrix.workspace }}

  # The images the pipeline deploys are built here on every change, so a broken
  # Dockerfile or a missing workspace file fails in CI and never at deploy time.
  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t beeside-backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t beeside-frontend:ci .
      - name: The backend image ships its migrations and runs as a non-root user
        run: |
          docker run --rm beeside-backend:ci node -e "require('fs').readdirSync('db/migrations')" > /dev/null
          test "$(docker run --rm beeside-backend:ci id -un)" = "node"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # What actually ships in the images. A high or critical advisory here blocks the change.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      # Development-only tooling is reported but does not block (it never reaches an environment).
      - name: Report development-only advisories
        run: npm audit --audit-level=high || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: bash scripts/secrets-scan.sh

  # FA Public v1.0 (module fa4): every customer-facing string without an approved canonical source is wrapped in NC(...) and listed in
  # docs/fa4/COPY_INVENTORY.md. The inventory must always match the code (it never rewrites copy).
  fa4-copy-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/fa4-copy-inventory.js --check

  # FA Public v1.0 against REAL PostgreSQL with the ACTUAL least-privilege runtime role (no owner/superuser in the application path):
  # persistence + security integration tests, then the end-to-end suite at 375 and 1440 with the API connected as the runtime login role.
  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build engine and backend
        run: |
          npm run build --workspace=shared/canonical-fields
          npm run build --workspace=shared/fa-public-engine
          npm run build --workspace=backend
      # Same system tools as build-lint-test (backend): the integration suites exercise the same document extraction.
      - name: System tools for document extraction (pdftotext, unzip)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils unzip
          command -v pdftotext unzip   # the step fails if either tool did not get installed
          pdftotext -v 2>&1 | head -1
      # All database-backed suites (Discovery, Precision, platform). Rolled-back suites share one database; every runtime-role suite gets its
      # OWN database and the canonical login topology (Discovery login only in beeside_discovery_rw, Precision login only in beeside_runtime_role),
      # bound by the same domain-roles-prepare step production uses. Root cause of the 2026-10-16 failures: one shared database for suites that commit data.
      - name: Integration suites (shared rolled-back + dedicated runtime-role databases)
        run: bash scripts/ci/integration.sh
      - name: End-to-end database
        run: psql -c "CREATE DATABASE fa4_e2e"
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end (375 + 1440), API as the runtime role
        env:
          E2E_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/fa4_e2e
          E2E_RUNTIME_DATABASE_URL: postgres://beeside_runtime:rt@127.0.0.1:5432/fa4_e2e
        run: npx playwright test
        working-directory: frontend
