name: KL CI (aislado)

# CI aislado de Knowledge Layer 1.0: PostgreSQL 16 efímero, Chromium fijado para el generador de PDF, datos sintéticos, sin secretos, sin despliegue y sin tocar
# ninguna base compartida (CR-KL-002 Handoff §4 y §7). Solo corre para la rama feat/kl-1.0-code.
on:
  push:
    branches: ["feat/kl-1.0-code"]
  pull_request:

permissions:
  contents: read

jobs:
  kl-tests:
    if: github.event_name == 'push' || github.head_ref == 'feat/kl-1.0-code'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Superusuario del servicio efímero: el arnés crea los roles kl_* y las bases beeside / beeside_kl.
      KL_TEST_PG_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      PRECISION_KNOWLEDGE_PROVIDER: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build shared packages
        run: |
          npm run build --workspace=shared/canonical-fields
          npm run build --workspace=shared/fa-public-engine
      - name: Chromium for the PDF generator (B6; pinned by the playwright-core version in the lockfile)
        run: npx playwright-core install --with-deps chromium
      - name: Typecheck and lint (KL and the files it touches)
        working-directory: backend
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx eslint "src/kl/**/*.ts" "src/admin/kl/**/*.ts" src/index.ts
      - name: KL tests (R1 X01-X22/X28/X29, R2 X30, R3 AC-10/X19, rehearsal of E1-E10)
        working-directory: backend
        run: npx jest -c src/kl/jest.kl.config.js --ci
